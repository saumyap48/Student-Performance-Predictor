<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - StudentAI</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="container">
        <div class="logo">🎓 StudentAI</div>
        <div style="display: flex; gap: 1rem; align-items: center;">
            <span id="userGreeting" class="text-muted"></span>
            <button id="themeToggle" class="btn" style="background: var(--glass); padding: 0.5rem 1rem;">🌓</button>
            <button id="logoutBtn" class="btn" style="color: var(--error); background: transparent; padding: 0.5rem 1rem;">Logout</button>
        </div>
    </nav>

    <main class="container">
        <div class="dashboard-grid">
            <!-- Prediction Form -->
            <div class="glass-card animate">
                <h2 class="mb-4">Predict Performance</h2>
                <form id="predictionForm">
                    <div class="form-group">
                        <label for="study_hours">Study Hours (per week)</label>
                        <input type="number" id="study_hours" step="0.1" min="0" max="100" placeholder="e.g. 15" required>
                    </div>
                    <div class="form-group">
                        <label for="attendance">Attendance (%)</label>
                        <input type="number" id="attendance" min="0" max="100" placeholder="e.g. 85" required>
                    </div>
                    <div class="form-group">
                        <label for="previous_score">Previous Score (0-100)</label>
                        <input type="number" id="previous_score" min="0" max="100" placeholder="e.g. 78" required>
                    </div>
                    <div class="form-group">
                        <label for="assignments_completed">Assignments Completed (0-10)</label>
                        <input type="number" id="assignments_completed" min="0" max="10" placeholder="e.g. 8" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Get Prediction</button>
                </form>
            </div>

            <!-- Result Display -->
            <div class="glass-card animate" style="display: flex; flex-direction: column; justify-content: center; align-items: center;">
                <h2 class="mb-4">Prediction Result</h2>
                <div id="resultContainer" class="text-center" style="display: none;">
                    <p class="text-muted">Estimated Score</p>
                    <div id="predictedScore" class="score-display">--</div>
                    <p id="predictionMessage" class="text-muted"></p>
                </div>
                <div id="noPrediction" class="text-muted text-center">
                    Submit the form to see your predicted performance.
                </div>
            </div>
        </div>

        <!-- History and Charts -->
        <div class="glass-card mt-4 animate" style="animation-delay: 0.2s;">
            <div style="display: flex; justify-content: space-between; align-items: center;" class="mb-4">
                <h2>Prediction History</h2>
                <button id="exportCsvBtn" class="btn" style="background: var(--glass); color: var(--success); border: 1px solid var(--success);">Export CSV</button>
            </div>
            
            <div class="dashboard-grid" style="grid-template-columns: 1.5fr 1fr; margin-top: 0;">
                <div class="table-container">
                    <table id="historyTable">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Study</th>
                                <th>Attend</th>
                                <th>Prev</th>
                                <th>Score</th>
                            </tr>
                        </thead>
                        <tbody id="historyBody">
                            <!-- Data will be injected here -->
                        </tbody>
                    </table>
                </div>
                <div>
                    <canvas id="historyChart"></canvas>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
